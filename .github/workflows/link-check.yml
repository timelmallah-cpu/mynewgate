name: Link check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 2 * *"
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run data
      - run: node scripts/check-links.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.*
